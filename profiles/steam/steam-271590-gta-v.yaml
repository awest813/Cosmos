id: gta_v
name: "Grand Theft Auto V"
store: steam
steam_appid: 271590
status: silver
recommended_backend: dxmt
wine_version: cosmos-stable
settings:
  retina: false
  windows_version: win10
dependencies:
  - vcrun2015
fixes:
  - disable_intro_video
notes: >
  DXMT handles the D3D11 renderer. Install vcrun2015 if you see missing-runtime
  errors. Story mode is the reliable path. GTA Online uses Rockstar anti-cheat and
  is blocked or unstable on macOS through Wine — expect online play to fail.
