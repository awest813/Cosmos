name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: Build Cosmos app (SwiftPM)
    # Apple Silicon runner; the app target requires macOS 13+ (see Package.swift).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          uname -m
          [[ "$(uname -m)" == "arm64" ]]

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Unit tests (Swift)
        run: swift test

  bundle-smoke:
    name: Bundle + release audit (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Stage offline runtime fixture
        run: FIXTURE=1 OUTPUT_DIR=build/offline-runtime scripts/stage_offline_runtime.command

      - name: Build Cosmos.app
        env:
          COSMOS_OFFLINE_FIXTURE: "1"
          COSMOS_BUILD_ARCHS: arm64
          OUTPUT_DIR: build
        run: scripts/build_cosmos_app.command

      - name: Release audit (bundled app)
        env:
          APP_BUNDLE: build/Cosmos.app
          COSMOS_EXPECTED_APP_ARCHS: arm64
        run: scripts/audit_release.sh

      - name: Wine gap validation (manifest sync)
        run: ./scripts/validate_wine_gaps.sh check

      - name: Ad-hoc DMG smoke
        env:
          SKIP_BUILD: "1"
          OUTPUT_DIR: build
          COSMOS_OFFLINE_FIXTURE: "1"
        run: scripts/build_dmg.command

  shell-syntax:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Full shell test suite
        run: ./scripts/test_all.sh

      - name: Wine gap validation (Gcenx pin sync)
        run: ./scripts/validate_wine_gaps.sh check
