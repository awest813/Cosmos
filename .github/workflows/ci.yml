name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: Build Cosmos app (SwiftPM)
    # Apple Silicon runner; the app target requires macOS 13+ (see Package.swift).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          uname -m
          [[ "$(uname -m)" == "arm64" ]]

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Unit tests (Swift)
        env:
          COSMOS_UI_SMOKE_OUTPUT_DIR: ${{ github.workspace }}/build/ui-smoke
        run: swift test

      - name: Native UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-native-ui
          path: build/ui-smoke/*.png
          if-no-files-found: warn

      - name: macOS filesystem and process contracts
        if: always()
        run: |
          status=0
          python3 scripts/test_audit_diagnostics.py || status=1
          python3 scripts/test_prefix_processes.py || status=1
          python3 scripts/test_environment_clone.py || status=1
          python3 scripts/test_environment_cleanup.py || status=1
          scripts/test_bottle_update.sh || status=1
          exit "$status"

      - name: Build installable preview
        env:
          COSMOS_BUILD_ARCHS: arm64
          OUTPUT_DIR: build/preview
        run: |
          test ! -e build/offline-runtime/cosmos-runtime-offline.tar.xz
          scripts/build_cosmos_app.command
          test ! -e build/preview/Cosmos.app/Contents/Resources/runtime/cosmos-runtime-offline.tar.xz
          APP_BUNDLE=build/preview/Cosmos.app COSMOS_EXPECTED_APP_ARCHS=arm64 scripts/audit_release.sh
          ditto -c -k --sequesterRsrc --keepParent build/preview/Cosmos.app build/Cosmos-arm64-preview.zip
          unzip -tq build/Cosmos-arm64-preview.zip

      - name: Apple Silicon preview app
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-arm64-preview
          path: build/Cosmos-arm64-preview.zip
          if-no-files-found: error

  bundle-smoke:
    name: Bundle + release audit (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Stage offline runtime fixture
        run: FIXTURE=1 OUTPUT_DIR=build/offline-runtime scripts/stage_offline_runtime.command

      - name: Build Cosmos.app
        env:
          COSMOS_OFFLINE_FIXTURE: "1"
          COSMOS_BUILD_ARCHS: arm64
          OUTPUT_DIR: build
        run: scripts/build_cosmos_app.command

      - name: Release audit (bundled app)
        env:
          APP_BUNDLE: build/Cosmos.app
          COSMOS_EXPECTED_APP_ARCHS: arm64
        run: scripts/audit_release.sh

      - name: Wine gap validation (manifest sync)
        run: ./scripts/validate_wine_gaps.sh check

      - name: Ad-hoc DMG smoke
        env:
          SKIP_BUILD: "1"
          OUTPUT_DIR: build
          COSMOS_OFFLINE_FIXTURE: "1"
        run: scripts/build_dmg.command

  shell-syntax:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Full shell test suite
        run: ./scripts/test_all.sh

      - name: Wine gap validation (Gcenx pin sync)
        run: ./scripts/validate_wine_gaps.sh check
