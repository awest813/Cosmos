name: Release

on:
  # Automatic path: pushing a version tag (v0.7.1, matching VERSION).
  push:
    tags:
      - "v*"
  # Manual path: let GitHub produce the Apple Silicon release on demand from the
  # Actions "Run workflow" button (or the API) without a local tag push. The
  # version is taken from VERSION and the tag is created by the release step.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build and publish Apple Silicon DMG
    runs-on: macos-15
    env:
      COSMOS_BUILD_ARCHS: arm64
      DMG_NAME: Cosmos-macos-arm64.dmg
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          uname -m
          [[ "$(uname -m)" == "arm64" ]]

      - name: Resolve version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Tag push: enforce that the pushed tag matches VERSION.
            tag="${GITHUB_REF_NAME#v}"
            if [[ "${tag}" != "${version}" ]]; then
              echo "Tag v${tag} must match VERSION (${version})." >&2
              exit 1
            fi
          else
            # Manual dispatch: derive the release straight from VERSION.
            tag="${version}"
            echo "::notice::Manual dispatch; releasing v${version} from VERSION."
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Building release v${version}"

      - name: Release audit
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: scripts/audit_release.sh

      - name: Resolve signing mode
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=()
          for key in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            DEVELOPER_ID_APPLICATION \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD
          do
            if [[ -z "${!key:-}" ]]; then
              missing+=("${key}")
            fi
          done

          if (( ${#missing[@]} == 0 )); then
            echo "mode=developer-id" >> "${GITHUB_OUTPUT}"
            echo "COSMOS_RELEASE_SIGNING=developer-id" >> "${GITHUB_ENV}"
            echo "Developer ID signing and notarization enabled."
          else
            echo "mode=ad-hoc" >> "${GITHUB_OUTPUT}"
            echo "COSMOS_RELEASE_SIGNING=ad-hoc" >> "${GITHUB_ENV}"
            echo "::notice::Ad-hoc release build; missing signing secret(s): ${missing[*]}"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          cert_path="$RUNNER_TEMP/cosmos-dev-id.p12"
          echo "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "${cert_path}"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "${cert_path}" -k build.keychain -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Build DMG
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          COSMOS_RELEASE_BUILD: "1"
        run: |
          if [[ "${COSMOS_RELEASE_SIGNING:-ad-hoc}" != "developer-id" ]]; then
            unset DEVELOPER_ID_APPLICATION APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD
          fi
          scripts/build_dmg.command

      - name: Bundle audit after build
        env:
          APP_BUNDLE: build/Cosmos.app
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          COSMOS_EXPECTED_APP_ARCHS: arm64
        run: scripts/audit_release.sh

      - name: SHA256 checksum
        run: |
          shasum -a 256 "build/${DMG_NAME}" | tee "build/${DMG_NAME}.sha256"
          printf '%s\n' "$(cut -d' ' -f1 "build/${DMG_NAME}.sha256")  ${DMG_NAME}" > "build/${DMG_NAME}.sha256.txt"

      - name: Generate release notes
        run: |
          ver="${{ steps.version.outputs.version }}"
          runtime="$(python3 -c 'import json; print(json.load(open("runtime/cosmos-runtime.json"))["version"])')"
          {
            echo "## Cosmos ${ver}"
            echo ""
            echo "| Component | Version |"
            echo "| --- | --- |"
            echo "| App | ${ver} |"
            echo "| macOS artifact | ${DMG_NAME} (Apple Silicon / arm64) |"
            echo "| Bundled runtime manifest | ${runtime} |"
            echo ""
            echo "Drag **Cosmos** from the disk image into **Applications**, then open the app for guided setup."
            echo ""
            echo "Verify download integrity:"
            echo '```'
            cat "build/${DMG_NAME}.sha256"
            echo '```'
            echo ""
            if [[ "${COSMOS_RELEASE_SIGNING:-ad-hoc}" == "developer-id" ]]; then
              echo "Signed with Developer ID and notarized for Gatekeeper."
            else
              echo "Ad-hoc signed CI build. Configure the Developer ID certificate, identity, and Apple notarization secrets for a Gatekeeper-clean release."
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Cosmos-macos-arm64.dmg
            build/Cosmos-macos-arm64.dmg.sha256
          body_path: release-notes.md
          # Pin the tag/commit explicitly so the same job works for both a tag
          # push and a manual dispatch (the tag is created here if it is absent).
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
